name: Auto-Build Games & Features Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**/game.json'
      - 'others/**/feature.json'

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Games Registry
        run: node scripts/build-registry.js

      - name: Commit & Push Updated Registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/games-registry.js
          if git diff --staged --quiet; then
            echo "No registry changes detected."
          else
            git commit -m "chore(registry): auto-compile games-registry.js [skip ci]"
            git push origin main
          fi
